name: Prettier Check and Format

# 워크플로우가 언제 실행될지 정의하는 부분
on:
  push:
    branches:
      - "**" # 모든 브랜치에 푸시될 때 실행
  pull_request:
    branches:
      - "**" # 모든 브랜치로 PR이 생성될 때 실행

# Prettier가 동작할 작업들을 정의
jobs:
  prettier:
    runs-on: ubuntu-latest # GitHub Actions에서 사용할 최신 우분투 환경

    permissions:
      contents: write # 파일 변경사항을 커밋·푸시하기 위한 쓰기 권한

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 레포지터리 코드를 체크아웃 (다운로드)
        with:
          ref: ${{ github.head_ref || github.ref_name }} # 현재 브랜치를 정확히 체크아웃

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Node.js 환경을 설정
        with:
          node-version: "20" # Node.js 버전 설정

      # 프론트엔드 디펜던시 설치
      - name: Install dependencies for Frontend
        run: npm install --force
        working-directory: ./frontend

      # 백엔드 디펜던시 설치
      - name: Install dependencies for Backend
        run: npm install --force
        working-directory: ./backend

      # Prettier 설치
      - name: Install Prettier
        run: npm install prettier --save-dev
        working-directory: .

      # 프리티어 규칙을 검증 (실패해도 다음 단계 계속 실행)
      - name: Check code formatting with Prettier
        run: npx prettier --check --ignore-path .prettierignore .
        continue-on-error: true

      # 프리티어 규칙에 맞게 코드 자동 수정
      # .github/ 폴더는 .prettierignore에서 제외 → workflow 파일 수정 권한 문제 방지
      - name: Format code with Prettier
        run: npx prettier --write --ignore-path .prettierignore .

      # 변경사항 커밋 & 푸시
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Apply Prettier formatting"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/KimGiJeong1101/clubing-project.git HEAD:${{ github.head_ref || github.ref_name }}

      # PR 머지 후 main 브랜치로 푸시
      - name: Push to main branch after PR merge
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git fetch origin main
          git checkout main
          git merge ${{ github.head_ref }} --no-ff --no-commit
          git push origin main
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
